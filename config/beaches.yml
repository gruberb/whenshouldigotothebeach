# South Shore beach registry.
#
# Station assignments are manual and reviewed, never auto-picked by distance:
# coastline geometry makes the nearest station a poor proxy in bays and estuaries.
# shore_bearing_degrees is the compass direction from the sand toward open water,
# used to classify forecast wind as onshore / offshore / cross-shore.
# tide_effect values are beach-specific, documented behaviours only.

