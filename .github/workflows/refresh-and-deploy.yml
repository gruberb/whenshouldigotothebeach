# Fetches fresh ECCC and CHS data, validates it, and deploys the site as a
# GitHub Pages artifact. Generated JSON is never committed to the repository;
# a failed fetch or validation leaves the previous deployment online.
#
# Triggering: GitHub's schedule is best-effort. Observed delivery is a
# handful of runs a day with gaps of many hours, and cron density makes no
# difference to the drop rate. The primary trigger is therefore an external
# scheduler calling workflow_dispatch every 30 minutes (setup in
# docs/ARCHITECTURE.md under "Refresh trigger"); the hourly cron below is
# the fallback for when that scheduler is down, kept off the top of the hour
# where drops cluster. The site carries generatedAt, validUntil and
# expiresAt so the frontend degrades honestly however the runs arrive.
name: Refresh Data and Deploy

on:
  schedule:
    - cron: "21 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Fetch and score beach data
        run: npm run data

      - name: Validate generated data
        run: npm run validate

      - name: Build site
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
