# Fetches fresh ECCC and CHS data, validates it, and deploys the site as a
# GitHub Pages artifact. Generated JSON is never committed to the repository;
# a failed fetch or validation leaves the previous deployment online.
#
# The cron runs off the top of the hour on purpose: GitHub delays or drops
# scheduled runs queued at busy times, and the site carries its own
# generatedAt/validUntil stamps so the frontend can flag stale data.
name: Refresh Data and Deploy

on:
  schedule:
    - cron: "17,47 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Fetch and score beach data
        run: npm run data

      - name: Validate generated data
        run: npm run validate

      - name: Build site
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
