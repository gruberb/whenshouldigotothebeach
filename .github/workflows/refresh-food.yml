# Refreshes the committed OpenStreetMap food snapshot. Weekly is plenty:
# places change on the scale of months, and keeping the snapshot in the repo
# keeps Overpass out of the 30-minute deploy loop entirely.
name: Refresh Food Snapshot

on:
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Refresh snapshot from Overpass
        run: npm run refresh:food

      - name: Validate against the pipeline
        run: npm test

      - name: Commit if changed
        run: |
          git config --local user.email "foreach@me.com"
          git config --local user.name "gruberb"
          if [[ $(git status --porcelain config/nearby-food.json) ]]; then
            git add config/nearby-food.json
            git commit -m "Refresh nearby food snapshot"
            git push
          else
            echo "No changes to the food snapshot"
          fi
